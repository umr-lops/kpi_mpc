name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sphinx:
    name: sphinx build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the setuptools-scm version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install kpimpc and the docs dependencies
        run: python -m pip install ".[docs]"
      - name: Build the documentation (same strictness as Read the Docs)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
